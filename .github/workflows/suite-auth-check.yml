name: Check suite login and navigation
on:
  pull_request:
    branches: [4418-inventory]
    paths:
      - 'src/main.tsx'
      - 'src/search.ts'
      - 'src/feedback.tsx'
      - 'src/style.css'
      - 'tests/search.unit.test.mjs'
      - 'tests/search-feedback.spec.ts'
      - 'src/suite-auth.ts'
      - 'src/services/auth.tsx'
      - 'src/navigation-context.ts'
      - 'src/use-list-context.ts'
      - 'src/locations.tsx'
      - 'tests/navigation-context.unit.test.mjs'
      - 'tests/search-context.spec.ts'
      - 'tests/tools.spec.ts'
      - 'src/SuiteSwitcher.tsx'
      - 'tests/shared/**'
      - 'tests/suite-auth-security.test.mjs'
      - '.github/workflows/suite-auth-check.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:security
      - run: npm run test:unit
      - run: npx playwright install --with-deps chromium
      - run: npm run test:shared
      - run: npm run test:logistics
      - run: npm run test:e2e
      - name: Retain navigation browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inventory-navigation-browser-evidence
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
