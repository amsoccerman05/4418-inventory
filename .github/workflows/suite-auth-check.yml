name: Check suite login and navigation
on:
  pull_request:
    branches: [4418-inventory]
    paths:
      - 'src/suite-auth.ts'
      - 'src/services/auth.tsx'
      - 'src/SuiteSwitcher.tsx'
      - 'tests/shared/**'
      - 'tests/suite-auth-security.test.mjs'
      - '.github/workflows/suite-auth-check.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:security
      - run: npx playwright install --with-deps chromium
      - run: npm run test:shared
      - run: npm run test:e2e
