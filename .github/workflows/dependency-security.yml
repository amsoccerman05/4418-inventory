name: Check dependency security and regressions
on:
  pull_request:
    branches: [4418-inventory]
    paths:
      - 'package*.json'
      - 'src/services/types.ts'
      - 'supabase/migrations/*_inventory_admin_lead_compatibility.sql'
      - 'tests/admin-lead-security.test.mjs'
      - 'tests/logistics-shared/current-role-journey.spec.ts'
      - 'tests/fixtures/**'
      - '.github/workflows/dependency-security.yml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Reject high and critical dependency advisories (including build tools)
        run: npm audit --audit-level=high
      - run: npm run build
      - run: npm run test:security
      - run: npm run test:unit
      - id: browser-install
        run: npx playwright install --with-deps chromium
      - run: npm run test:shared
      - if: ${{ !cancelled() && steps.browser-install.outcome == 'success' }}
        run: npm run test:logistics
      - if: ${{ !cancelled() && steps.browser-install.outcome == 'success' }}
        run: npm run test:e2e
      - name: Retain local-fixture browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inventory-browser-evidence
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
